spring.application.name=provafinal

# Na EC2: o deploy passa DB_HOST=postgres-aula e DB_PASSWORD pelo GitHub Secrets
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:auladb}
spring.datasource.username=${DB_USER:usuario}
spring.datasource.password=${DB_PASSWORD:senha}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH0_ISSUER:https://dev-ws7izgxg5afd106q.us.auth0.com/}
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH0_AUDIENCE:https://artigos-api}

app.auth0.namespace=https://social-insper.com/