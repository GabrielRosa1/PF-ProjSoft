name: Deploy automatico

on:
  push:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build com Maven
        working-directory: provafinal
        run: mvn -B package --file pom.xml

      - name: Login no Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e push da imagem
        uses: docker/build-push-action@v5
        with:
          context: ./provafinal
          file: ./provafinal/Dockerfile
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/provafinal:${{ github.sha }}

      - name: Deploy na EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_TEST }}
          username: ubuntu
          key: ${{ secrets.KEY_TEST }}
          port: 22
          script: |
            docker stop provafinal || true
            docker rm provafinal || true
            docker run -d \
              -p 8080:8080 \
              --network=rede \
              --restart unless-stopped \
              --name provafinal \
              -e DB_HOST=postgres-prova \
              -e DB_PASSWORD='${{ secrets.DB_PASSWORD }}' \
              ${{ secrets.DOCKERHUB_USERNAME }}/provafinal:${{ github.sha }}
            docker image prune -f